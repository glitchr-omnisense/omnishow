# omnisense/omnishow with every omnishow/* provider:
#
#   docker compose run --rm omnishow test       # every package's tests (recorded answers, no network)
#   docker compose run --rm omnishow bare       # plain PHP: a registry, a search, a lookup, episodes, offers - and what PHP loaded
#   docker compose run --rm omnishow live       # the checks that need no key (Wikidata), within its policies
#   docker compose run --rm omnishow phpstan    # PHPStan, each package at the highest level
#   docker compose down -v                      # the harness's volume gone
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNISHOW_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
name: omnishow-harness

services:
  omnishow:
    build: .
    image: omnisense/omnishow-harness
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnishow/core
      - ${OMNISHOW_PLUGINS:-./plugins}:/omnishow/plugins:ro
      - harness:/harness

volumes:
  harness:
